<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 610" role="img" aria-labelledby="title desc">
  <title id="title">The Panergos difference</title>
  <desc id="desc">Four Panergos capability cards: portable continuity, delta memory, scoped browser relay, and governed delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#120b1f"/>
      <stop offset="1" stop-color="#090712"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff6b5e" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff6b5e" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2ee6a6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2ee6a6" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7c453" stop-opacity=".2"/>
      <stop offset="1" stop-color="#f7c453" stop-opacity=".03"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#f7f2ff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1600" height="610" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="610" rx="34" fill="url(#grid)"/>
  <path d="M70 113h250" stroke="#ff6b5e" stroke-width="5" stroke-linecap="round"/>
  <path d="M320 113h250" stroke="#f7c453" stroke-width="5" stroke-linecap="round"/>
  <path d="M570 113h250" stroke="#2ee6a6" stroke-width="5" stroke-linecap="round"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="70" y="72" fill="#f7f2ff" font-size="38" font-weight="760" letter-spacing="4">THE PANERGOS DIFFERENCE</text>
    <text x="1530" y="73" fill="#b9a9c8" font-size="22" text-anchor="end" letter-spacing="2">KEEP THE THREAD · CHANGE THE TOOL</text>

    <g transform="translate(70 158)">
      <rect width="345" height="380" rx="25" fill="url(#coral)" stroke="#ff6b5e" stroke-opacity=".42"/>
      <circle cx="58" cy="60" r="25" fill="#ff6b5e" fill-opacity=".13" stroke="#ff6b5e"/>
      <path d="M45 60h27m-8-9 9 9-9 9" fill="none" stroke="#ff6b5e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="125" fill="#ff6b5e" font-size="18" font-weight="800" letter-spacing="2">PORTABLE CONTINUITY</text>
      <text x="32" y="169" fill="#f7f2ff" font-size="27" font-weight="720">One session.</text>
      <text x="32" y="205" fill="#f7f2ff" font-size="27" font-weight="720">Many surfaces.</text>
      <text x="32" y="260" fill="#b9a9c8" font-size="19">Authenticated API clients reuse</text>
      <text x="32" y="289" fill="#b9a9c8" font-size="19">the same session ID and stored</text>
      <text x="32" y="318" fill="#b9a9c8" font-size="19">history across model routes.</text>
      <text x="32" y="352" fill="#ffb5ae" font-size="16" font-weight="700">API KEY + SESSION ID</text>
    </g>

    <g transform="translate(442 158)">
      <rect width="345" height="380" rx="25" fill="url(#jade)" stroke="#2ee6a6" stroke-opacity=".42"/>
      <circle cx="58" cy="60" r="25" fill="#2ee6a6" fill-opacity=".12" stroke="#2ee6a6"/>
      <path d="M47 50h22M47 60h17M47 70h12" stroke="#2ee6a6" stroke-width="4" stroke-linecap="round"/>
      <text x="32" y="125" fill="#2ee6a6" font-size="18" font-weight="800" letter-spacing="2">DELTA MEMORY</text>
      <text x="32" y="169" fill="#f7f2ff" font-size="27" font-weight="720">Read changes.</text>
      <text x="32" y="205" fill="#f7f2ff" font-size="27" font-weight="720">Resume from proof.</text>
      <text x="32" y="260" fill="#b9a9c8" font-size="19">Incremental project indexing,</text>
      <text x="32" y="289" fill="#b9a9c8" font-size="19">bounded retrieval, checkpoints,</text>
      <text x="32" y="318" fill="#b9a9c8" font-size="19">and durable handoffs.</text>
      <text x="32" y="352" fill="#8ff2cf" font-size="16" font-weight="700">LESS REREADING · LESS CONTEXT</text>
    </g>

    <g transform="translate(814 158)">
      <rect width="345" height="380" rx="25" fill="url(#amber)" stroke="#f7c453" stroke-opacity=".42"/>
      <circle cx="58" cy="60" r="25" fill="#f7c453" fill-opacity=".12" stroke="#f7c453"/>
      <path d="M47 50h22v18H47zM52 74h12" fill="none" stroke="#f7c453" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="125" fill="#f7c453" font-size="18" font-weight="800" letter-spacing="2">PANERGOS RELAY</text>
      <text x="32" y="169" fill="#f7f2ff" font-size="27" font-weight="720">One goal.</text>
      <text x="32" y="205" fill="#f7f2ff" font-size="27" font-weight="720">One chosen tab.</text>
      <text x="32" y="260" fill="#b9a9c8" font-size="19">Live browser progress with</text>
      <text x="32" y="289" fill="#b9a9c8" font-size="19">least-privilege pairing, manual</text>
      <text x="32" y="318" fill="#b9a9c8" font-size="19">approval, evidence, and Stop.</text>
      <text x="32" y="352" fill="#fbe09a" font-size="16" font-weight="700">EXPLICIT SCOPE · HUMAN CONTROL</text>
    </g>

    <g transform="translate(1186 158)">
      <rect width="345" height="380" rx="25" fill="url(#coral)" stroke="#2ee6a6" stroke-opacity=".35"/>
      <circle cx="58" cy="60" r="25" fill="#ff6b5e" fill-opacity=".12" stroke="#2ee6a6"/>
      <circle cx="49" cy="53" r="5" fill="#ff6b5e"/><circle cx="69" cy="53" r="5" fill="#f7c453"/><circle cx="59" cy="70" r="5" fill="#2ee6a6"/>
      <path d="m53 56 4 9m8-9-4 9" stroke="#f7f2ff" stroke-opacity=".65" stroke-width="2"/>
      <text x="32" y="125" fill="#2ee6a6" font-size="18" font-weight="800" letter-spacing="2">GOVERNED DELIVERY</text>
      <text x="32" y="169" fill="#f7f2ff" font-size="27" font-weight="720">Brief to release.</text>
      <text x="32" y="205" fill="#f7f2ff" font-size="27" font-weight="720">Owners to evidence.</text>
      <text x="32" y="260" fill="#b9a9c8" font-size="19">Cross-department work packages,</text>
      <text x="32" y="289" fill="#b9a9c8" font-size="19">approval gates, verification,</text>
      <text x="32" y="318" fill="#b9a9c8" font-size="19">and restart-safe missions.</text>
      <text x="32" y="352" fill="#ffb5ae" font-size="16" font-weight="700">ACCOUNTABLE · RESUMABLE</text>
    </g>
  </g>
</svg>
