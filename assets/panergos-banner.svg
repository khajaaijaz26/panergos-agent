<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Panergos Agent</title>
  <desc id="desc">Panergos Relay mark with the words Panergos Agent and Work without losing the thread.</desc>
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0v80" fill="none" stroke="#2ee6a6" stroke-opacity=".08"/>
      <circle cx="0" cy="0" r="2" fill="#2ee6a6" fill-opacity=".28"/>
    </pattern>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#120b1f"/>
      <stop offset="1" stop-color="#090712"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="460" rx="32" fill="url(#surface)"/>
  <rect width="1600" height="460" rx="32" fill="url(#grid)"/>
  <g transform="translate(120 110) scale(2.5)">
    <path d="M14 20h17l21 21" fill="none" stroke="#ff6b5e" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"/>
    <path d="M14 76h17l21-21" fill="none" stroke="#2ee6a6" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"/>
    <path d="M14 48h66" fill="none" stroke="#f7c453" stroke-linecap="round" stroke-width="11"/>
    <path d="m70 34 14 14-14 14" fill="none" stroke="#f7c453" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="440" y="214" fill="#f7f2ff" font-size="104" font-weight="750" letter-spacing="5">PANERGOS</text>
    <text x="1055" y="214" fill="#2ee6a6" font-size="104" font-weight="750" letter-spacing="5">AGENT</text>
    <rect x="445" y="270" width="76" height="8" rx="4" fill="#ff6b5e"/>
    <rect x="533" y="270" width="76" height="8" rx="4" fill="#f7c453"/>
    <rect x="621" y="270" width="76" height="8" rx="4" fill="#2ee6a6"/>
    <text x="445" y="340" fill="#b9a9c8" font-size="35" font-weight="550" letter-spacing="8">WORK WITHOUT LOSING THE THREAD</text>
  </g>
</svg>
