name: Build Skills Index

on:
  workflow_dispatch: # Manual trigger
  push:
    branches: [main]
    paths:
      - "scripts/build_skills_index.py"
      - ".github/workflows/skills-index.yml"

permissions:
  contents: read
  actions: write # to trigger deploy-site.yml after a successful build

jobs:
  build-index:
    # Only run for the canonical Panergos repository, not arbitrary forks.
    if: github.repository == 'khajaaijaz26/panergos-agent'
    runs-on: ubuntu-latest
    # A first run has no published snapshot to preserve and may need the full
    # serial ClawHub bootstrap. Later runs merge a bounded refresh in ~12 min.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: pip install httpx==0.28.1 pyyaml==6.0.2

      - name: Seed the last published index
        run: |
          set -euo pipefail
          index="website/static/api/skills-index.json"
          mkdir -p "$(dirname "$index")"
          if curl -fsSL --retry 3 --retry-delay 5 \
            "https://khajaaijaz26.github.io/panergos-agent/docs/api/skills-index.json" \
            -o "$index.download"; then
            mv "$index.download" "$index"
          else
            rm -f "$index.download"
            echo "::notice::No published snapshot found; running the one-time full bootstrap"
          fi

      - name: Build skills index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_skills_index.py

      - name: Upload index artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: skills-index
          path: website/static/api/skills-index.json
          retention-days: 7

  # Re-trigger the docs deploy so the refreshed index lands on the live site.
  # The deploy itself is owned by deploy-site.yml (which crawls and deploys
  # everything in one pipeline); each successful index build kicks it once.
  trigger-deploy:
    needs: build-index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Deploy Site workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --repo ${{ github.repository }} -f skills_index_run_id=${{ github.run_id }}
