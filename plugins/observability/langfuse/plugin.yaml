name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Panergos — traces conversations, LLM calls, and tool usage. Opt-in via `panergos plugins enable observability/langfuse` or `panergos tools → Langfuse Observability`."
author: Panergos contributors
requires_env:
  - PANERGOS_LANGFUSE_PUBLIC_KEY
  - PANERGOS_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_finalize
  - on_session_end
  - subagent_start
  - subagent_stop
