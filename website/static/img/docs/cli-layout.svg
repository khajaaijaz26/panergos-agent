<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Panergos CLI interface layout</title>
  <desc id="desc">Stylized terminal window showing the Panergos CLI banner, conversation area, and fixed input prompt.</desc>
  <rect width="960" height="520" rx="18" fill="#0d0718"/>
  <rect x="18" y="18" width="924" height="484" rx="14" fill="#120b1f" stroke="#332442"/>
  <rect x="18" y="18" width="924" height="42" rx="14" fill="#1a122a" stroke="#332442"/>
  <circle cx="48" cy="39" r="8" fill="#ff5f56"/>
  <circle cx="74" cy="39" r="8" fill="#ffbd2e"/>
  <circle cx="100" cy="39" r="8" fill="#27c93f"/>
  <text x="480" y="44" text-anchor="middle" fill="#f7f2ff" font-family="Inter, sans-serif" font-size="18" font-weight="600">Panergos CLI</text>

  <rect x="48" y="86" width="864" height="136" rx="12" fill="#1a122a" stroke="#4a385a"/>
  <text x="72" y="112" fill="#ff6b5e" font-family="JetBrains Mono, monospace" font-size="16">PANERGOS AGENT</text>
  <rect x="72" y="126" width="190" height="72" rx="10" fill="#211631" stroke="#5d456c"/>
  <text x="92" y="150" fill="#f7c453" font-family="JetBrains Mono, monospace" font-size="14">Constellation banner</text>
  <text x="92" y="172" fill="#b9a9c8" font-family="JetBrains Mono, monospace" font-size="13">Model, terminal, tools,</text>
  <text x="92" y="190" fill="#b9a9c8" font-family="JetBrains Mono, monospace" font-size="13">skills, working dir</text>
  <rect x="292" y="126" width="590" height="72" rx="10" fill="#211631" stroke="#5d456c"/>
  <text x="316" y="150" fill="#f7f2ff" font-family="JetBrains Mono, monospace" font-size="14">Model: anthropic/claude-sonnet-4</text>
  <text x="316" y="172" fill="#f7f2ff" font-family="JetBrains Mono, monospace" font-size="14">Terminal: local   Working dir: /home/user/project</text>
  <text x="316" y="194" fill="#f7f2ff" font-family="JetBrains Mono, monospace" font-size="14">Tools: 19   Skills: 12   Session: 20260315_123456_abcd1234</text>

  <rect x="48" y="246" width="864" height="182" rx="12" fill="#1a122a" stroke="#332442"/>
  <text x="72" y="278" fill="#b9a9c8" font-family="JetBrains Mono, monospace" font-size="14">Conversation output</text>
  <text x="72" y="320" fill="#f7c453" font-family="JetBrains Mono, monospace" font-size="15">┊ terminal: git status</text>
  <text x="72" y="350" fill="#2ee6a6" font-family="JetBrains Mono, monospace" font-size="15">Panergos: Working tree is clean. Ready for the next task.</text>
  <text x="72" y="380" fill="#b9a9c8" font-family="JetBrains Mono, monospace" font-size="15">Panergos streams tool progress and responses here.</text>

  <rect x="48" y="448" width="864" height="30" rx="10" fill="#211631" stroke="#5d456c"/>
  <text x="72" y="468" fill="#ff6b5e" font-family="JetBrains Mono, monospace" font-size="15">❯</text>
  <text x="98" y="468" fill="#f7f2ff" font-family="JetBrains Mono, monospace" font-size="15">Fixed input area at the bottom with slash-command autocomplete</text>
</svg>
